name: FVH App CI/CD

on:
  push:
    branches: [main, 'image-updater-**']
    tags:
      - '*-v*.*.*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build and push :next-{version} image on release-please PRs.
  # The release job promotes this image instead of rebuilding on tag push.
  build:
    if: startsWith(github.head_ref, 'release-please--branches--main')
    uses: ForumViriumHelsinki/.github/.github/workflows/reusable-container-build.yml@main
    with:
      image-name: forumviriumhelsinki/${{ github.event.repository.name }}
      # version-command: "jq -r '.version' package.json"  # default; adjust for Python etc.

  # Promote the pre-built PR image to release tags on tag push.
  # Falls back to a full rebuild if the pre-built image is not found.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ForumViriumHelsinki/.github/.github/workflows/reusable-container-release.yml@main
    with:
      image-name: forumviriumhelsinki/${{ github.event.repository.name }}
      tag-prefix: ${{ github.event.repository.name }}-v

  # Automated releases via release-please
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ForumViriumHelsinki/.github/.github/workflows/reusable-release-please.yml@main
    with:
      app-id: ${{ vars.CI_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Auto-merge ArgoCD Image Updater PRs.
  # Single-job design: creates PR, approves, and enables auto-merge in one run,
  # since a two-job design cannot rely on a GITHUB_TOKEN-created PR triggering
  # the second job.
  #
  # app-id is what keeps this unattended. Since GitHub's 2026-06-11 bot-PR
  # change, a PR authored by github-actions[bot] has its workflow runs held in
  # `action_required` until a human approves them, so a PR created with
  # GITHUB_TOKEN never merges on its own. The CI App's installation token
  # authors it instead, and the checks start by themselves.
  auto-merge:
    if: startsWith(github.ref_name, 'image-updater-')
    uses: ForumViriumHelsinki/.github/.github/workflows/reusable-auto-merge-image-updater.yml@main
    with:
      pr-title: "build: automatic update of ${{ github.event.repository.name }}"
      app-id: ${{ vars.CI_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      AUTO_MERGE_PAT: ${{ secrets.AUTO_MERGE_PAT }}

  # Security scan on PRs
  security:
    if: github.event_name == 'pull_request'
    uses: ForumViriumHelsinki/.github/.github/workflows/reusable-security-owasp.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
