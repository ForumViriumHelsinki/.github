name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Prevent bot-triggered events from starting the job (saves billing minutes)
    if: github.event.sender.type != 'Bot'
    uses: ForumViriumHelsinki/.github/.github/workflows/reusable-claude.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # Uncomment to customize:
    # with:
    #   max_turns: 30
    #   claude_args: "--allowedTools 'Bash(git:*)'"
