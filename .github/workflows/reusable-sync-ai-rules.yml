name: Sync AI Rules

on:
  workflow_call:
    inputs:
      app-id:
        description: 'GitHub App client ID (or numeric App ID; client ID recommended). When set, the sync PR is opened with an App token (via APP_PRIVATE_KEY) instead of GITHUB_TOKEN.'
        required: false
        type: string
        default: ''
      targets:
        description: 'Comma-separated rulesync targets to generate, from claudecode, copilot, antigravity-ide and cursor. Defaults to Claude Code only; add a target only for a tool this repo actually uses.'
        required: false
        type: string
        default: 'claudecode'
    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key. Required when app-id is set.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot open a PR in a repo where "Allow GitHub Actions to
      # create and approve pull requests" is off (GitHub's default), and a PR it
      # does open triggers no CI. An App token avoids both.
      - name: Generate GitHub App token
        id: app-token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout calling repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # --path .rulesync: rulesync >= 9 resolves features relative to the repo
      # root of the source repo (GET /contents/rules), so the .rulesync/ layout
      # must be addressed explicitly or the fetch 404s and returns zero files.
      - name: Fetch rules from .github repo
        run: npx rulesync@latest fetch ForumViriumHelsinki/.github --features rules,ignore --conflict overwrite --path .rulesync

      # fetch exits 0 even when it fetches nothing, and generate then fails
      # (or silently no-ops) — fail fast with a pointer to the rules source.
      - name: Verify rules were fetched
        run: |
          [ -n "$(find .rulesync/rules -name '*.md' -print -quit 2>/dev/null)" ] || {
            echo "::error::rulesync fetch produced no rule files — check the .rulesync/rules/ source in ForumViriumHelsinki/.github"
            exit 1
          }

      # Explicit targets/features: fetch pulls only .rulesync/, never
      # rulesync.jsonc, and with no config the default is the agentsmd target
      # alone, which writes zero files for these rules at exit 0. `allowed`
      # and --features must equal this repo's rulesync.jsonc, and every input
      # target must be one of `allowed` (pinned by
      # .github/tests/sync-ai-rules-targets/run.sh). The #111 pilot found the
      # three non-Claude trees had no consumer in either pilot repo, hence the
      # claudecode default.
      - name: Generate tool-specific files
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          allowed=" claudecode copilot antigravity-ide cursor "
          # `read -a` drops a trailing empty field, so empty elements are refused here.
          case ",$TARGETS," in
            *,,*) echo "::error::targets '$TARGETS' is empty or has an empty element; expected a comma-separated subset of:$allowed"; exit 1 ;;
          esac
          IFS=',' read -ra requested <<<"$TARGETS"
          for t in "${requested[@]}"; do
            case "$allowed" in
              *" $t "*) ;;
              *) echo "::error::unknown rulesync target '$t' in targets '$TARGETS'; allowed:$allowed"; exit 1 ;;
            esac
          done
          npx rulesync@latest generate --targets "$TARGETS" --features rules,ignore

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ inputs.app-id != '' && steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync AI coding rules from .github repo"
          title: "chore: sync AI coding rules"
          body: |
            ## Summary

            - Synced AI coding rules from `ForumViriumHelsinki/.github` via rulesync
            - Regenerated tool-specific files for the targets: ${{ inputs.targets }}

            ## Test plan

            - [ ] Verify `.claude/rules/` files have correct `paths:` frontmatter
            - [ ] If `copilot` is a target: `.github/instructions/` contains `.instructions.md` files
            - [ ] If `cursor` is a target: `.cursor/rules/` contains `.mdc` files
            - [ ] If `antigravity-ide` is a target: every `.agents/rules/` file starts with `trigger:` frontmatter (Antigravity ignores rules without it)
            - [ ] Check the `.claude/settings.json` diff: generation replaces every `Read(...)` entry in `permissions.deny` with the synced `.aiignore` set and keeps the other entries, so a `Read(...)` deny this repo added by hand is dropped

            🤖 Generated with rulesync
          branch: chore/sync-ai-rules
          delete-branch: true
