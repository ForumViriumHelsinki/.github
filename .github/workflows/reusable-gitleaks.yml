name: Gitleaks (Reusable)

# Scans the caller's checked-out tree with gitleaks: the default secret rules
# plus FVH's `fvh-gcp-project-id` rule, which flags an FVH GCP project ID or a
# Cloud SQL connection name. Neither is a credential, but in a public repo they
# map the org's infrastructure for anyone reading. Meant for public repos (#149).
#
# Design notes, so callers and maintainers do not rediscover them:
#
#   - The release binary, not gitleaks-action: the action needs a paid licence
#     on organization accounts. The install step is lint.yml's, verbatim
#     (version and sha256 included); the gitleaks-reusable and tool-pins tests
#     keep the two in step, and Renovate bumps both.
#   - The tree is scanned (`gitleaks dir`), not git history. An identifier that
#     was committed and later removed is not reported.
#   - The FVH rule is embedded below between BEGIN/END markers, byte-identical
#     to this repo's .gitleaks.toml (gitleaks-reusable checks it). It is not
#     fetched at run time: a called workflow cannot learn its own ref
#     (`github.workflow_sha` is the caller's), so a fetched config would float
#     at @main even for a caller that pinned this workflow by SHA.
#   - The caller's own config (`config-path`, default .gitleaks.toml) is
#     extended when it exists, so its rules and allowlists apply. gitleaks reads
#     it exactly as written: the default rules run only if it sets
#     `[extend] useDefault = true` (a caller config that does not gets a
#     warning), and its global allowlists also cover the FVH rule. When no
#     caller config exists, the default rules run. gitleaks
#     ignores an `[extend]` two levels below this workflow's config, so a
#     caller config that itself extends a file gets a warning: that file's
#     rules load, but its own `useDefault` or `path` does not.
#   - Exit code 2 means findings. gitleaks exits 1 on every error (bad config,
#     unreadable tree), so findings and a broken scan are told apart instead
#     of both reading as a leak.
#   - `enforcement` is validated: anything other than exactly `block` or `warn`
#     fails the job. `warn` (for a first rollout to a repo that already holds
#     identifiers) softens findings only. Scan has no continue-on-error: it
#     fails the job in both modes when the scan does not complete (bad config,
#     gitleaks error, unreadable report), and otherwise writes the annotations,
#     the summary and the `findings` count. The last step, Enforce, is the only
#     one with continue-on-error, and all it does is fail on findings > 0, so
#     under `warn` findings leave the job green while a broken scan stays red.
#   - `--redact` keeps matched secrets out of the report; annotations and the
#     job summary carry only rule, file and line. GitHub shows at most 10
#     annotations of a kind per step; the job summary lists every finding.
#
# Caller example (workflow-templates/gitleaks.yml):
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#
#   permissions:
#     contents: read
#
#   jobs:
#     gitleaks:
#       uses: ForumViriumHelsinki/.github/.github/workflows/reusable-gitleaks.yml@main
#       with:
#         enforcement: warn   # until the repo's existing findings are cleaned up

on:
  workflow_call:
    inputs:
      enforcement:
        description: >-
          'block' (default): findings fail the job. 'warn': findings are
          annotated as warnings and the job stays green. A scan that does not
          complete fails the job in both modes. Any other value fails the job.
        required: false
        type: string
        default: 'block'
      config-path:
        description: >-
          The caller's gitleaks config, relative to the repository root. Extended
          when it exists; a missing file is an error unless this is the default.
        required: false
        type: string
        default: '.gitleaks.toml'
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'ubuntu-slim'
    outputs:
      findings:
        description: 'Number of findings; empty when the scan did not complete'
        value: ${{ jobs.gitleaks.outputs.findings }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # The job only curls a static binary and runs it, so ubuntu-slim suffices.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate inputs
        env:
          ENFORCEMENT: ${{ inputs.enforcement }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          case "$ENFORCEMENT" in
            block|warn) ;;
            *) echo "::error::enforcement must be 'block' or 'warn', got '${ENFORCEMENT}'. Refusing to scan under an enforcement mode this workflow does not understand."; exit 1 ;;
          esac
          # config-path is written into a TOML string, and must name a file in
          # the checkout.
          safe='^[A-Za-z0-9._/-]+$'
          if [[ ! "$CONFIG_PATH" =~ $safe ]]; then
            echo "::error::config-path must be a non-empty path of letters, digits, '.', '_', '-' and '/'."
            exit 1
          fi
          case "$CONFIG_PATH" in
            /*) echo "::error::config-path must be relative to the repository root, got '${CONFIG_PATH}'."; exit 1 ;;
          esac
          case "/$CONFIG_PATH/" in
            */../*) echo "::error::config-path must not contain a '..' component, got '${CONFIG_PATH}'."; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install gitleaks
        # GITLEAKS_VERSION is bumped by Renovate; GITLEAKS_SHA256 by hand.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Write FVH gitleaks config
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/fvh-gitleaks.toml"
          caller="$GITHUB_WORKSPACE/$CONFIG_PATH"
          if [ -f "$caller" ]; then
            case "$caller" in
              *"'"*|*$'\n'*) echo "::error::the workspace path cannot be written into a TOML literal string."; exit 1 ;;
            esac
            extend="path = '$caller'"
            echo "Extending the caller's gitleaks config $CONFIG_PATH."
            # Reads only [extend]: a [[rules]] entry has a path field too. An
            # unparseable file prints nothing here and is left to gitleaks,
            # which fails the scan.
            flags=$(python3 -I -c '
          import sys, tomllib
          try:
              e = tomllib.load(open(sys.argv[1], "rb")).get("extend")
          except Exception:
              sys.exit(0)
          e = e if isinstance(e, dict) else {}
          if e.get("path"):
              print("nested")
          if e.get("useDefault") is not True:
              print("nodefault")
          ' "$caller" 2>/dev/null) || flags=""
            if grep -qx nodefault <<<"$flags"; then
              echo "::warning file=$CONFIG_PATH::$CONFIG_PATH does not set [extend] useDefault = true, so gitleaks' default secret rules are not running; only its own rules and the FVH rule are. Add useDefault = true under [extend] to keep them."
            fi
            if grep -qx nested <<<"$flags"; then
              echo "::warning file=$CONFIG_PATH::$CONFIG_PATH extends another file. gitleaks loads that file's rules but ignores its own [extend] (useDefault or path), two levels below this workflow's config."
            fi
          elif [ "$CONFIG_PATH" != ".gitleaks.toml" ]; then
            echo "::error::config-path '$CONFIG_PATH' does not exist in the checkout."
            exit 1
          else
            extend="useDefault = true"
            echo "No $CONFIG_PATH in the caller; running the default rules and the FVH rule."
          fi
          {
            printf '%s\n' 'title = "gitleaks config written by ForumViriumHelsinki/.github reusable-gitleaks.yml"' '' '[extend]' "$extend" ''
            cat <<'TOML'
          # BEGIN fvh-gcp-project-id
          [[rules]]
          id = "fvh-gcp-project-id"
          description = "FVH GCP project ID or Cloud SQL connection name in a public file"
          regex = '''\b(?:fvh-project-[a-z0-9-]+|[a-z][a-z0-9-]*:europe-north1:[a-z0-9-]+)\b'''
          keywords = ["fvh-project-", ":europe-north1:"]
          tags = ["fvh", "identifier"]

            [[rules.allowlists]]
            description = "Placeholder project in documentation examples"
            regexTarget = "match"
            regexes = ['''^my-project:europe-north1:''']
          # END fvh-gcp-project-id
          TOML
          } > "$config"

      - name: Scan
        id: scan
        # No continue-on-error: a scan that did not complete is red under warn
        # too. Findings are judged by Enforce below.
        env:
          ENFORCEMENT: ${{ inputs.enforcement }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks.json"
          rm -f "$report"
          rc=0
          "$RUNNER_TEMP/bin/gitleaks" dir --no-banner --redact --exit-code 2 \
            --config "$RUNNER_TEMP/fvh-gitleaks.toml" \
            --report-format json --report-path "$report" . || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::gitleaks exited $rc without completing the scan (a configuration or runtime error, not a finding); see the log above."
            exit "$rc"
          fi
          if [ ! -f "$report" ] || ! jq -e 'type == "array"' "$report" >/dev/null 2>&1; then
            echo "::error::gitleaks exited $rc but wrote no readable report."
            exit 1
          fi
          n=$(jq 'length' "$report")
          if [ "$rc" -eq 2 ] && [ "$n" -eq 0 ]; then
            echo "::error::gitleaks reported leaks (exit 2) but its report is empty."
            exit 1
          fi
          echo "findings=$n" >> "$GITHUB_OUTPUT"

          level=error
          if [ "$ENFORCEMENT" = "warn" ]; then level=warning; fi
          # File names and rule descriptions come from the caller's tree and
          # config: escape them for workflow-command properties and messages,
          # and keep each summary row on one line.
          {
            echo "## gitleaks"
            echo
            if [ "$n" -eq 0 ]; then
              echo "No leaks found."
            else
              echo "$n finding(s), enforcement \`$ENFORCEMENT\`. Matched values are redacted."
              echo
              echo "| RuleID | File | Line |"
              echo "|--------|------|------|"
              jq -r 'def cell: tostring | gsub("[\r\n]"; " ") | gsub("\\|"; "\\|");
                .[] | "| \(.RuleID | cell) | \(.File // "" | sub("^\\./"; "") | cell) | \(.StartLine // "" | cell) |"' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r --arg level "$level" '
            def prop: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
            def msg: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            .[] | "::\($level) file=\(.File // "" | sub("^\\./"; "") | prop)"
              + (if (.StartLine | type) == "number" then ",line=\(.StartLine | floor)" else "" end)
              + ",title=gitleaks \(.RuleID | prop)::\(.Description // .RuleID | msg)"' "$report"

      - name: Enforce
        # The only step that warn softens, and it does nothing but judge the
        # count Scan wrote.
        continue-on-error: ${{ inputs.enforcement == 'warn' }}
        env:
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          set -euo pipefail
          if [[ ! "$FINDINGS" =~ ^[0-9]+$ ]]; then
            echo "::error::Scan wrote no findings count (got '${FINDINGS}')."
            exit 1
          fi
          if [ "$FINDINGS" -gt 0 ]; then
            echo "gitleaks: $FINDINGS finding(s); see the annotations and the job summary."
            exit 1
          fi
          echo "gitleaks: no findings."
