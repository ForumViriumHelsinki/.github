name: Claude Code Review (Reusable)

# Automated PR review using Claude Code. Reviews every PR for code quality,
# potential bugs, security issues, test coverage, and documentation needs.
# Skips release-please PRs and bot actors by default.
#
# Calling workflow should trigger on:
#   pull_request:
#     types: [opened, synchronize, reopened]
#
# Example caller:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#
#   jobs:
#     review:
#       uses: ForumViriumHelsinki/.github/.github/workflows/reusable-claude-review.yml@main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      skip_release_please:
        description: 'Skip review on release-please PRs'
        required: false
        type: boolean
        default: true
      skip_bots:
        description: 'Skip review when PR author is github-actions[bot]'
        required: false
        type: boolean
        default: true
      review_prompt:
        description: 'Custom review prompt (replaces default)'
        required: false
        type: string
        default: ''
      claude_args:
        description: 'Additional arguments for Claude Code'
        required: false
        type: string
        default: '--model claude-opus-4-8 --effort medium --max-turns 20'
      allowed_tools:
        description: >-
          Comma-separated tools passed to --allowedTools, added to the action's own
          defaults. Review is read-only work, so the default grants exploration,
          read-only git, and `gh pr` — no Write/Edit, no push. This list used to sit
          in `additional_permissions`, where it was inert (see the comment at the
          action step).
        required: false
        type: string
        default: 'Read,Grep,Glob,Task,Agent,TodoWrite,Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(gh pr *)'
      additional_allowed_tools:
        description: 'Extra comma-separated tools appended to allowed_tools (replaces the old tool-list use of additional_permissions)'
        required: false
        type: string
        default: ''
      additional_permissions:
        description: >-
          GitHub permissions map forwarded to the action for its App token, as
          "key: value" lines (e.g. "actions: read"). NOT a Claude tool list — that
          is allowed_tools / additional_allowed_tools.
        required: false
        type: string
        default: ''
      plugins:
        description: 'Claude Code plugins to load'
        required: false
        type: string
        default: ''
      plugin_marketplaces:
        description: 'Claude Code plugin marketplace URLs'
        required: false
        type: string
        default: ''
      allowed_bots:
        description: 'Comma-separated bot usernames allowed to trigger the review'
        required: false
        type: string
        default: 'claude[bot],claude'
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  # Required for the action's github_ci MCP server (CI status, run details, job
  # logs). On a PR in tag mode the action probes this job's GITHUB_TOKEN with
  # listWorkflowRunsForRepo and skips the server on a 403, logging "The github_ci
  # MCP server requires 'actions: read' permission". The probe uses github.token,
  # not the App token, so `additional_permissions` cannot substitute for this.
  actions: read

jobs:
  review:
    if: >-
      (!inputs.skip_release_please || !startsWith(github.head_ref, 'release-please--')) &&
      (!inputs.skip_bots || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
          track_progress: true
          prompt: |
            ${{ inputs.review_prompt || 'Review this pull request. Focus on:
            - Code quality and best practices
            - Potential bugs or security issues
            - Test coverage gaps
            - Documentation needs

            IMPORTANT: Use built-in tools (Read, Grep, Glob) for file exploration.
            Do NOT use Bash for find/grep operations - use the dedicated tools instead.

            Evidence rules:
            - A blocker, or a claim that code will fail, does not parse, or uses a module, function, API or language feature that does not exist, must cite evidence obtained in this run: a file you read, a tool output, or a CI job result. Without that evidence, post the point as a question, not a blocker. Your knowledge of language and library versions can predate the code under review; for example, Python 3.14 accepts an unparenthesized `except A, B:` clause without an `as` binding (PEP 758).
            - Do not report syntax or parse errors from reading code. CI is the source for syntax and lint: read the lint and test results for the head commit with the github_ci tools (mcp__github_ci__get_ci_status, mcp__github_ci__get_workflow_run_details, mcp__github_ci__download_job_log). This review starts alongside CI, so those checks are often still pending; while they are pending or absent, make no parse or lint claims and say that CI has not reported yet.' }}
          # The tool boundary belongs in `--allowedTools`. It used to sit in
          # `additional_permissions:`, but that input takes a GitHub permissions
          # MAP ("actions: read"): the action skips every line without a colon, so
          # the list was inert and none of it reached the SDK's allowedTools.
          #
          # --allowedTools is additive: the action accumulates repeated flags and
          # merges them with its own tag-mode tools. `allowed_tools` is a separate
          # input from `claude_args` so a caller overriding claude_args (to change
          # --model or --max-turns) does not silently drop the tool grant.
          claude_args: >-
            ${{ inputs.claude_args }}
            --allowedTools "${{ inputs.allowed_tools }}${{ inputs.additional_allowed_tools && format(',{0}', inputs.additional_allowed_tools) || '' }}"
          # A real GitHub permissions map now, pass-through only. The github_ci
          # server reads the job token, which the `permissions:` block above grants.
          additional_permissions: ${{ inputs.additional_permissions }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
